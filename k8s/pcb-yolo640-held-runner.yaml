apiVersion: v1
kind: Pod
metadata:
  name: pcb-yolo640-held-runner
  namespace: csuf-titans
  labels:
    app: pcb-yolo640-held-runner
spec:
  restartPolicy: Never
  priorityClassName: opportunistic
  activeDeadlineSeconds: 86400
  containers:
    - name: trainer
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
      command: ["/bin/bash", "-lc", "sleep 604800"]
      env:
        - name: WORKSPACE
          value: /workspace
        - name: REPO
          value: /repo
        - name: PYTHONHASHSEED
          value: "42"
      resources:
        requests:
          cpu: "4"
          memory: 32Gi
          ephemeral-storage: 80Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 32Gi
          ephemeral-storage: 100Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
        - name: yolo-scripts
          mountPath: /repo/reports/publication
          readOnly: true
        - name: tools
          mountPath: /repo/tools
          readOnly: true
        - name: kaggle-token
          mountPath: /secrets/kaggle
          readOnly: true
  volumes:
    - name: workspace
      emptyDir:
        sizeLimit: 100Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: yolo-scripts
      configMap:
        name: pcb-yolo640-audit-scripts
        defaultMode: 0555
    - name: tools
      configMap:
        name: pcb-resolution-control-tools
        defaultMode: 0555
    - name: kaggle-token
      secret:
        secretName: kaggle-access-token
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [Tesla-V100-SXM2-32GB]
