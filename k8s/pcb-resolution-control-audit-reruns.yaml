          command: ["/bin/bash", "/repo/worker.sh"]
          env:
            - name: MODE
              value: "640"
            - name: WORKSPACE
              value: /workspace
            - name: PYTHONHASHSEED
              value: "42"
            - name: HOLD_FOR_COLLECTION
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: scripts
              mountPath: /repo
              readOnly: true
            - name: tools
              mountPath: /repo/tools
              readOnly: true
            - name: kaggle-token
              mountPath: /secrets/kaggle
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: pcb-resolution-control-final-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: scripts
          configMap:
            name: pcb-resolution-control-worker
            defaultMode: 0555
        - name: tools
          configMap:
            name: pcb-resolution-control-tools
            defaultMode: 0555
        - name: kaggle-token
          secret:
            secretName: kaggle-access-token
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [Tesla-V100-SXM2-32GB]
