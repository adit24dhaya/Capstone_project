apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pcb-rtdetr-640-workspace
  namespace: csuf-titans
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
  storageClassName: rook-ceph-block-fullerton
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pcb-rtdetr-highres-workspace
  namespace: csuf-titans
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
  storageClassName: rook-ceph-block-fullerton
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pcb-rtdetr-640
  namespace: csuf-titans
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: pcb-rtdetr-640
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
        - name: trainer
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["/bin/bash", "/repo/worker.sh"]
          env:
            - name: MODE
              value: "640"
            - name: WORKSPACE
              value: /workspace
            - name: PYTHONHASHSEED
              value: "42"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: scripts
              mountPath: /repo
              readOnly: true
            - name: tools
              mountPath: /repo/tools
              readOnly: true
            - name: kaggle-token
              mountPath: /secrets/kaggle
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: pcb-rtdetr-640-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: scripts
          configMap:
            name: pcb-resolution-control-worker
            defaultMode: 0555
        - name: tools
          configMap:
            name: pcb-resolution-control-tools
            defaultMode: 0555
        - name: kaggle-token
          secret:
            secretName: kaggle-access-token
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [Tesla-V100-SXM2-32GB]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pcb-rtdetr-highres
  namespace: csuf-titans
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: pcb-rtdetr-highres
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic2
      containers:
        - name: trainer
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["/bin/bash", "/repo/worker.sh"]
          env:
            - name: MODE
              value: highres
            - name: WORKSPACE
              value: /workspace
            - name: PYTHONHASHSEED
              value: "42"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: scripts
              mountPath: /repo
              readOnly: true
            - name: tools
              mountPath: /repo/tools
              readOnly: true
            - name: kaggle-token
