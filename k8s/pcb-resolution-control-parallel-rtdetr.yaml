              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: pcb-rtdetr-highres-resume-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: scripts
          configMap:
            name: pcb-resolution-control-worker
            defaultMode: 0555
        - name: tools
          configMap:
            name: pcb-resolution-control-tools
            defaultMode: 0555
        - name: kaggle-token
          secret:
            secretName: kaggle-access-token
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
